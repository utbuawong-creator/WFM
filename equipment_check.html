<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WFM NOPBIGMAN | เช็คเครื่องมือ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--org:#f47920;--grn:#8dc63f;--blue:#003087;--red:#e8001d;--bg:#f0f4f0;--sf:#fff;--bd:#e0e8e0;--tx:#1a2a1a;--tx2:#5a7a5a;--r:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--tx)}
.hdr{background:linear-gradient(135deg,#e8670a,#f47920 45%,#8dc63f);color:#fff;box-shadow:0 4px 20px rgba(244,121,32,.4)}
.hdr-in{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;max-width:600px;margin:0 auto}
.hdr-t{font-family:'Kanit',sans-serif;font-size:22px;font-weight:800}
.hdr-s{font-size:12px;opacity:.8;margin-top:2px}
.hdr-d{font-size:10px;letter-spacing:3px;opacity:.8;text-transform:uppercase;font-family:'Kanit',sans-serif}
.home-a{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);color:#fff;border-radius:10px;padding:7px 13px;font-size:12px;font-weight:700;text-decoration:none}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 80px}
.clock-card{background:linear-gradient(135deg,#003087,#0057b8);border-radius:var(--r);padding:14px 18px;color:#fff;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 5px 0 #001f5c}
.cv{font-family:'Kanit',sans-serif;font-size:24px;font-weight:700;letter-spacing:2px}
.cd{font-size:12px;opacity:.8;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:#8dc63f;animation:pulse 1.5s infinite;display:inline-block}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}
.card{background:var(--sf);border-radius:var(--r);padding:20px 18px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.07);border:1px solid var(--bd)}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--bd)}
.cb{width:4px;height:22px;background:linear-gradient(180deg,var(--org),var(--grn));border-radius:3px}
.ct{font-family:'Kanit',sans-serif;font-weight:800;font-size:15px}
.L{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:6px;margin-top:14px}
.L:first-child{margin-top:0}
.inp{width:100%;background:#f8faf8;border:2px solid var(--bd);border-radius:10px;padding:12px 14px;color:var(--tx);font-size:15px;font-family:'Sarabun',sans-serif;outline:none;transition:border .2s;-webkit-appearance:none}
.inp:focus{border-color:var(--org)}
.inp-ro{background:#f0f4f0;color:var(--tx2)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.sc{background:#f8faf8;border:2px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .18s;user-select:none}
.sc.on{border-color:var(--org);background:linear-gradient(135deg,#fff8f3,#fff);box-shadow:0 2px 10px rgba(244,121,32,.2)}
.sr{width:20px;height:20px;border-radius:50%;border:2px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.sc.on .sr{background:var(--org);border-color:var(--org)}
.sd{width:8px;height:8px;border-radius:50%;background:#fff;display:none}
.sc.on .sd{display:block}
.st{font-family:'Kanit',sans-serif;font-size:14px;font-weight:700}
.sl{font-size:11px;color:var(--tx2);margin-top:1px}
.pb{border:2px dashed var(--bd);border-radius:12px;background:#f8faf8;cursor:pointer;overflow:hidden;position:relative;height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.pb:hover{border-color:var(--org);background:#fff8f3}
.pb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-ic{font-size:36px;color:var(--tx2)}
.ph-tx{font-size:13px;color:var(--tx2);font-weight:600}
.ph-sub{font-size:11px;color:#aaa}
.del-ph{position:absolute;top:8px;right:8px;background:rgba(220,38,38,.85);color:#fff;border:none;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;z-index:2;font-family:'Sarabun',sans-serif}
.btn-s{width:100%;background:linear-gradient(135deg,#f47920,#e8670a);color:#fff;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;font-family:'Kanit',sans-serif;box-shadow:0 6px 0 #b85710;transition:all .15s;margin-top:8px}
.btn-s:active{transform:translateY(4px);box-shadow:0 2px 0 #b85710}
.btn-s:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-g{width:100%;background:#f0f4f0;color:var(--tx2);border:2px solid var(--bd);border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif;margin-top:10px}
.btn-db{width:100%;background:linear-gradient(135deg,#003087,#0057b8);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Kanit',sans-serif;box-shadow:0 5px 0 #001f5c;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
#sf{display:none}
.si{font-size:72px;text-align:center;margin-bottom:12px;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.st2{font-family:'Kanit',sans-serif;font-size:24px;font-weight:800;color:#2e7d32;text-align:center;margin-bottom:4px}
.ss{font-size:13px;color:var(--tx2);text-align:center;margin-bottom:20px}
.ci-card{background:linear-gradient(160deg,#1B5E20,#2E7D32 50%,#1a3a1a);border-radius:20px;padding:22px 20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.2);max-width:420px;margin-left:auto;margin-right:auto}
.ci-stamp{position:absolute;top:16px;right:16px;background:rgba(141,198,63,.2);border:2px solid rgba(141,198,63,.5);border-radius:10px;padding:5px 10px;font-family:'Kanit',sans-serif;font-size:11px;font-weight:700;color:#8dc63f;transform:rotate(5deg)}
.ci-logo{font-size:11px;letter-spacing:3px;opacity:.7;text-transform:uppercase;font-family:'Kanit',sans-serif;margin-bottom:12px}
.ci-photo{width:100%;height:220px;border-radius:12px;object-fit:cover;object-position:center 20%;margin-bottom:14px;border:2px solid rgba(255,255,255,.2);display:none}
.ci-name{font-family:'Kanit',sans-serif;font-size:22px;font-weight:800;margin-bottom:4px}
.ci-zone{font-size:13px;opacity:.8;margin-bottom:14px}
.ci-rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.ci-row{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px}
.ci-row.full{grid-column:1/-1}
.ci-rl{font-size:10px;opacity:.7;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.ci-rv{font-family:'Kanit',sans-serif;font-size:14px;font-weight:700}
.ci-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(244,121,32,.25);border:1px solid rgba(244,121,32,.4);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;letter-spacing:1px}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.btn-cp{background:linear-gradient(135deg,#003087,#0057b8);color:#fff;border:none;border-radius:12px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Kanit',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 #001f5c}
.btn-nw{background:linear-gradient(135deg,#f47920,#e8670a);color:#fff;border:none;border-radius:12px;padding:13px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Kanit',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 #b85710}
.btn-hm{width:100%;background:#f0f4f0;color:var(--tx2);border:2px solid var(--bd);border-radius:12px;padding:12px;font-size:14px;font-weight:700;text-decoration:none;display:block;text-align:center;font-family:'Sarabun',sans-serif}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;overflow-y:auto;padding:12px;backdrop-filter:blur(4px)}
.modal-box{max-width:520px;margin:0 auto;background:var(--sf);border-radius:20px;padding:20px}
.toast-w{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none}
.toast{background:#1a2a1a;border-radius:20px;padding:10px 20px;font-size:13px;font-weight:700;color:#fff;opacity:0;transform:translateY(10px);transition:all .3s;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:#2e7d32}.toast.err{background:#c62828}
.eq{background:#f8faf8;border:2px solid var(--bd);border-radius:12px;padding:12px 12px 12px;margin-bottom:10px}
.eq.bad{border-color:#dc2626;background:#fef2f2}
.eq.okk{border-color:#8dc63f;background:#f7fbf0}
.eq-t{font-family:'Kanit',sans-serif;font-size:14px;font-weight:700;margin-bottom:8px}
.eq-b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.eb{border:2px solid var(--bd);background:#fff;border-radius:10px;padding:10px 4px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif;color:var(--tx2)}
.eb.ok.on{background:#2e7d32;border-color:#2e7d32;color:#fff}
.eb.bad.on{background:#dc2626;border-color:#dc2626;color:#fff}
.eb.na.on{background:#6b7280;border-color:#6b7280;color:#fff}
.btn-all{width:100%;background:#f1f8e9;color:#2e7d32;border:2px solid #8dc63f;border-radius:12px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;font-family:'Kanit',sans-serif;margin-bottom:12px}
#pv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:400;align-items:center;justify-content:center;padding:12px}
#pv img{max-width:100%;max-height:100%;border-radius:10px}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-in">
    <div>
      <div class="hdr-d">WFM · NOPBIGMAN</div>
      <div class="hdr-t">🧰 เช็คเครื่องมือ</div>
      <div class="hdr-s">ตรวจเครื่องมือและอุปกรณ์ประจำวัน</div>
    </div>
    <a href="WFM_Home.html" class="home-a">🏠 หน้าหลัก</a>
  </div>
</div>

<div class="wrap">
  <div class="clock-card">
    <div><div class="cv" id="cl-t">--:--:--</div><div class="cd" id="cl-d">กำลังโหลด...</div></div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;opacity:.85"><div class="dot"></div> ออนไลน์</div>
  </div>

  <!-- FORM -->
  <div id="ff">
    <div class="card">
      <div class="ch"><div class="cb"></div><div class="ct">ข้อมูลผู้ตรวจ</div></div>
      <label class="L">👤 ชื่อ-นามสกุล</label>
      <select class="inp" id="fn">
        <option value="">— เลือกชื่อ —</option>
        <option>โพธิยา มหาชัย</option><option>จักรพงษ์ บัวประทะ</option><option>เอกรินทร์ โสภา</option>
        <option>วัชริศ ปินใจ</option><option>อัมพวัฒน์ พัชรพัฒนชัย</option><option>เมธาศิษฎ์ เศรษฐจ์วุฒิภัทร</option>
        <option>วรชัย นุ่มตูม</option><option>พัทธนันท์ ปันเขียว</option><option>ทักษิณ ลาดกำแพง</option>
        <option>ฐูกลวิทย์ กิตติกุลสุวรรณ</option><option>เจษฎา จิโน</option><option>สุรศักดิ์ ใหม่ป้อ</option>
        <option>อลงกรณ์ โปริ๊</option><option>ปรัตถกร คุ้มประคอง</option><option>ธนิน ถึงสุข</option>
        <option>นนทพัทธ์ ไฝหาวิทย์</option><option>ชัชชัย ก้อยงามเลิศ</option><option>บรรจง ตี๋เนาะ</option>
        <option>นำโชค คงอิ่ม</option><option>ธงชัย มณีสิงหราช</option><option>เอกลักษณ์ ดอกสม</option>
        <option>วรเชษฐ์ จันตี๊คาด</option><option>สุทธิพงศ์ ปาลี</option><option>นวพล ธรรมขันแก้ว</option>
        <option>บดินทร์ อาษากิจ</option><option>สมเพชร ก้อยงามเลิศ</option><option>สรายุทธ กรนทีกาญจน์</option>
        <option>นิเวศ ตาแม่กั๋ง</option><option>พงษ์นคร กองมี</option><option>ณัฐนนท์ สุวรรณ์</option>
        <option>ธนาพันธ์ อินทะจันทร์</option><option>จิรพงศ์ ใจจิต</option><option>จิรวัฒน์ พรธนานิธินันท์</option>
        <option>อนุชิต คำเขียว</option><option>ภาสกร ญาติฝูง</option><option>มงคล ไทยประเทศ</option>
        <option>นพดนัย อมรวิโรจน์รัตน์</option><option>มานิตย์ ทิวาประดับดาว</option><option>อภิวัฒน์ ไชยสุรินทร์</option>
        <option>ณัฏฐพล พิศพันธุ์</option><option>วิทยา แสนเกรียง</option><option>ณัฐพล พัชรพัฒนชัย</option>
        <option>คมกริช ทาแกง</option><option>สรศักดิ์ ผิวขาว</option><option>ศรายุทธ สมพงษ์</option>

        <option>นิธิพันธ์ ศิริโปทา</option><option>อภิรักษ์ จันทร์คำ</option>
        <option>ปิ่นเพชร แก้วเสน่ห์</option>
        <option>ศุภกิตติ์ สุวรรณ์</option>
        <option>เทวนพ เข่งค้า</option>
        <option>วชิรวุธ เพ็ชรเขียว</option>
      </select>
      <label class="L">🗺️ MC Zone</label>
      <select class="inp" id="fz">
        <option value="">— เลือก Zone —</option>
        <option>CMI Zone AB</option><option>CMI Zone CD</option>
        <option>LPN Zone</option><option>MSN Zone</option>
      </select>
      <label class="L">📅 วันที่ปัจจุบัน</label>

      <input class="inp inp-ro" id="ft" readonly style="font-family:'Kanit',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px"/>
    </div>

    <div class="card">
      <div class="ch"><div class="cb"></div><div class="ct">🧰 รายการเครื่องมือและอุปกรณ์</div><div id="prog" style="margin-left:auto;font-size:12px;font-weight:700;color:var(--tx2)"></div></div>

      <div id="eql"></div>
    </div>

    <div class="card" id="phc" style="display:none">
      <div class="ch"><div class="cb" style="background:#dc2626"></div><div class="ct">📸 รูปอุปกรณ์ที่ชำรุด (บังคับ 1 รูป)</div></div>

      <div class="ss" id="ssub"></div>
      <div id="sbad"></div>
      <div class="ag" id="sag" style="display:none"><button class="btn-cp" onclick="cpBad()">📋 คัดลอกการ์ดแจ้งชำรุด</button><button class="btn-nw" onclick="rst(true)">➕ เช็คคนถัดไป</button></div>

<!-- SUMMARY MODAL -->
<div class="modal-bg" id="dm">
  <div class="modal-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-family:'Kanit',sans-serif;font-size:16px;font-weight:800">📊 สรุปเช็คเครื่องมือ</div>
      <button onclick="clDash()" style="background:var(--bg);border:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Sarabun',sans-serif">✕ ปิด</button>
    </div>
    <input type="date" class="inp" id="dpk" onchange="pkDate(this.value)"/>
    <div id="dtx" style="font-size:12px;color:var(--tx2);margin:6px 0 12px"></div>
    <div id="db"></div>
    <div class="ag" style="margin-top:12px"><button class="btn-cp" onclick="cpDash()">📋 คัดลอกภาพ</button><button class="btn-nw" onclick="exDash()">📥 Export Excel</button></div>
  </div>
</div>

<div id="pv" onclick="this.style.display='none'"><img id="pvi" alt=""></div>

<div class="toast-w"><div class="toast" id="tst"></div></div>

<script>
var FB='https://fiberoptic-tracker-default-rtdb.asia-southeast1.firebasedatabase.app';
var ADMIN_PW='560225'; // รหัส admin เดียวกับ Work Error Log

function ldph(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement('canvas');
      var max=900,w=img.width,h=img.height;
      if(w>h&&w>max){h=h*max/w;w=max;}else if(h>=w&&h>max){w=w*max/h;h=max;}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      ph=c.toDataURL('image/jpeg',0.72);
      var box=document.getElementById('phb');
      box.innerHTML='<img src="'+ph+'"><button class="del-ph" onclick="dlph(event)">✕ ลบรูป</button>';
      box.onclick=null;
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(f);inp.value='';
}
function resetPhotoBox(){

}

  var btn=document.getElementById('bsb');
  btn.disabled=true;btn.textContent='⏳ กำลังตรวจสอบ...';

// ── CANVAS HELPERS ────────────────────────────────────────
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function isComb(ch){var c=ch.charCodeAt(0);return c===0x0e31||(c>=0x0e34&&c<=0x0e3a)||(c>=0x0e47&&c<=0x0e4e);}
function wrapTxt(ctx,text,maxW){
  var out=[],cur='';
  text=String(text||'');
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(isComb(ch)){cur+=ch;continue;}
    var t=cur+ch;
    if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=ch;}else cur=t;
  }
  if(cur)out.push(cur);
  return out.length?out:[''];
}
function shareOrDl(blob,fname,okMsg){
  var file=new File([blob],fname,{type:'image/png'});
  var isMob=/Android|iPhone|iPad/i.test(navigator.userAgent);
  if(isMob&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file]}).then(function(){toast(okMsg,'ok');}).catch(function(){});
    return;
  }
  if(navigator.clipboard&&window.ClipboardItem){
    navigator.clipboard.write([new ClipboardItem({'image/png':blob})]).then(function(){toast(okMsg,'ok');}).catch(function(){dlBlob(blob,fname);});
    return;
  }
  dlBlob(blob,fname);
}
function dlBlob(blob,fname){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname||'image.png';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);},1000);
  toast('📥 บันทึกรูปแล้ว','ok');
}

function cpBad(){

  buildBadCard(function(c){

  });

function buildBadCard(cb){
  var W=720,PAD=28,PH=last.photo?440:0,TOP=last.photo?0:44;
  var m=document.createElement('canvas').getContext('2d');
  var boxes=last.bad.map(function(b){
    m.font='700 22px sans-serif';var tl=wrapTxt(m,b.label,W-PAD*2-90);
    m.font='500 19px sans-serif';var nl=wrapTxt(m,b.note,W-PAD*2-90);
    return {t:tl,n:nl,h:22+tl.length*30+nl.length*27+14};
  });
  var bh=boxes.reduce(function(s,b){return s+b.h+12;},0);
  var IH=232+bh+60;
  var H=PH+TOP+IH;
  var c=document.createElement('canvas');c.width=W;c.height=H;
  var ctx=c.getContext('2d');
  var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#7f1d1d');g.addColorStop(.5,'#b91c1c');g.addColorStop(1,'#450a0a');
  ctx.fillStyle=g;rr(ctx,0,0,W,H,28);ctx.fill();
  function drawInfo(){
    var y=PH+TOP;
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='700 15px sans-serif';ctx.textAlign='left';
    if(!PH)ctx.fillText('AIS 3BB  \u00b7  WFM NOPBIGMAN',PAD,36);
    ctx.fillStyle='#fde68a';ctx.font='800 20px sans-serif';ctx.fillText('\ud83d\udea8  \u0e41\u0e08\u0e49\u0e07\u0e2d\u0e38\u0e1b\u0e01\u0e23\u0e13\u0e4c\u0e0a\u0e33\u0e23\u0e38\u0e14  ('+last.bad.length+' \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23)',PAD,y+34);
    ctx.fillStyle='#fff';ctx.font='800 36px sans-serif';
    var nm=last.name;while(ctx.measureText(nm).width>W-PAD*2&&nm.length>4)nm=nm.slice(0,-1);
    ctx.fillText(nm,PAD,y+84);
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='500 20px sans-serif';ctx.fillText(last.zone,PAD,y+116);
    ctx.fillText(last.dateThai+'   '+last.time,PAD,y+148);
    var by=y+176;
    boxes.forEach(function(b){
      ctx.fillStyle='rgba(255,255,255,.96)';rr(ctx,PAD,by,W-PAD*2,b.h,14);ctx.fill();
      ctx.fillStyle='#b91c1c';ctx.font='700 22px sans-serif';
      b.t.forEach(function(l,i){ctx.fillText((i===0?'\u274c  ':'     ')+l,PAD+16,by+34+i*30);});
      ctx.fillStyle='#1a2a1a';ctx.font='500 19px sans-serif';
      b.n.forEach(function(l,i){ctx.fillText(l,PAD+48,by+34+b.t.length*30-6+i*27+8);});
      by+=b.h+12;
    });
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='500 14px sans-serif';ctx.textAlign='center';
    ctx.fillText('NOPBIGMAN \u00b7 WFM System \u00b7 AIS 3BB',W/2,H-20);
  }
  if(last.photo){
    var img=new Image();
    img.onload=function(){
      ctx.save();rr(ctx,0,0,W,H,28);ctx.clip();ctx.beginPath();ctx.rect(0,0,W,PH);ctx.clip();
      var sc=Math.max(W/img.width,PH/img.height),dw=img.width*sc,dh=img.height*sc;
      ctx.drawImage(img,(W-dw)/2,Math.max((PH-dh)/2,(PH-dh)),dw,dh);
      var ov=ctx.createLinearGradient(0,PH-120,0,PH);ov.addColorStop(0,'rgba(127,29,29,0)');ov.addColorStop(1,'rgba(127,29,29,1)');
      ctx.fillStyle=ov;ctx.fillRect(0,PH-120,W,120);
      ctx.restore();
      drawInfo();cb(c);
    };
    img.src=last.photo;
  } else {drawInfo();cb(c);}
}

function ldDash(){

function clDash(){document.getElementById('dm').style.display='none';if(location.hash==='#sum')history.replaceState(null,'',location.pathname);}
function pkDate(v){if(v)fetchEq(v);}
function dateTxt(ds){var d=new Date(ds+'T12:00:00');return 'วัน'+DA[d.getDay()]+'ที่ '+d.getDate()+' '+MO[d.getMonth()]+' '+(d.getFullYear()+543);}
function fetchDay(ds,cb){
  Promise.all([
    fetch(FB+'/equipment.json').then(function(r){return r.json();}).catch(function(){return {};}),
    fetch(FB+'/checkins.json').then(function(r){return r.json();}).catch(function(){return {};})
  ]).then(function(a){
    var recs=toArr(a[0]).filter(function(r){return r.date===ds;}).sort(function(x,y){return (x.time||'').localeCompare(y.time||'');});
    var cis=toArr(a[1]).filter(function(r){return r.date===ds;});
    cb(eqStats(recs,cis));
  });
}
function eqStats(recs,cis){
  var done={};recs.forEach(function(r){done[r.name]=1;});
  var bad=recs.filter(function(r){return r.badCount>0;});
  var okRecs=recs.filter(function(r){return !(r.badCount>0);});
  var items=bad.reduce(function(s,r){return s+(r.badCount||0);},0);
  var seen={},pend=[];
  cis.forEach(function(r){if(!done[r.name]&&!seen[r.name]){seen[r.name]=1;pend.push(r.name);}});
  return {recs:recs,bad:bad,ok:okRecs,items:items,pend:pend};
}
function fetchEq(ds){
  document.getElementById('dtx').textContent=dateTxt(ds);
  document.getElementById('db').innerHTML='<div style="text-align:center;padding:24px;color:#888">⏳ กำลังโหลด...</div>';
  fetchDay(ds,function(st){dashData=st;renderDash(st);});
}

  }
  if(st.pend.length){
    h+='<div style="background:#fff;border:2px solid #fdba74;border-radius:14px;padding:12px 14px;margin-bottom:10px"><div style="font-family:Kanit,sans-serif;font-size:14px;font-weight:800;color:#b45309;margin-bottom:8px">❓ Check-in แล้ว แต่ยังไม่เช็คเครื่องมือ ('+st.pend.length+' คน)</div><div style="display:flex;flex-wrap:wrap;gap:5px">'+st.pend.map(function(n){return '<div style="background:#fff7ed;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;color:#7c2d12">'+esc(n)+'</div>';}).join('')+'</div></div>';
  }
  if(st.ok.length){
    h+='<details style="background:#f7fbf0;border:2px solid #8dc63f;border-radius:14px;padding:10px 14px;margin-bottom:10px"><summary style="cursor:pointer;font-family:Kanit,sans-serif;font-size:14px;font-weight:800;color:#2E7D32">✅ ปกติทั้งหมด ('+st.ok.length+' คน)</summary><div style="margin-top:8px">'+st.ok.map(function(r){return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid #e0e8e0"><div style="flex:1;font-size:13px;font-weight:700">'+esc(r.name)+'</div><div style="font-size:11px;color:#888">'+esc(hhmm(r.time))+'</div><button onclick="delRec(\''+esc(r.id)+'\',\''+esc(r.name)+'\')" style="background:#fff;color:#dc2626;border:2px solid #fca5a5;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;font-family:Sarabun,sans-serif">🗑️</button></div>';}).join('')+'</div></details>';
  }
  document.getElementById('db').innerHTML=h;
}
function vwPh(id){
  toast('⏳ กำลังโหลดรูป...','');
  fetch(FB+'/equipment_photos/'+id+'.json').then(function(r){return r.json();}).then(function(d){
    if(!d||!d.p){toast('ไม่พบรูป','err');return;}
    document.getElementById('pvi').src=d.p;document.getElementById('pv').style.display='flex';
  }).catch(function(){toast('โหลดรูปไม่สำเร็จ','err');});
}
function delRec(id,name){
  var pw=prompt('ใส่รหัส admin เพื่อลบรายการของ '+name);
  if(pw===null)return;
  if(pw!==ADMIN_PW){toast('รหัสไม่ถูกต้อง','err');return;}
  Promise.all([
    fetch(FB+'/equipment/'+id+'.json',{method:'DELETE'}),
    fetch(FB+'/equipment_photos/'+id+'.json',{method:'DELETE'})
  ]).then(function(){toast('🗑️ ลบรายการของ '+name+' แล้ว','ok');fetchEq(document.getElementById('dpk').value);})
    .catch(function(){toast('ลบไม่สำเร็จ','err');});
}

function cpDash(){
  if(!dashData)return;
  toast('⏳ กำลังสร้างภาพ...','');
  buildSumCanvas(dashData,dateTxt(document.getElementById('dpk').value),function(c){
    c.toBlob(function(b){shareOrDl(b,'equipment_summary.png','📋 Copy แล้ว! วางใน Teams/Line ได้เลย');},'image/png',1.0);
  });
}
function buildSumCanvas(st,dateText,cb){
  var W=1080,PAD=24,GAP=16;
  var m=document.createElement('canvas').getContext('2d');
  var bw=W-PAD*2-32;
  var cards=st.bad.map(function(r){
    var its=toArr(r.bad).map(function(b){
      m.font='700 18px sans-serif';var tl=wrapTxt(m,b.label,W-PAD*2-110);
      m.font='500 16px sans-serif';var nl=wrapTxt(m,b.note,W-PAD*2-110);
      return {t:tl,n:nl,h:12+tl.length*26+nl.length*23+8};
    });
    return {r:r,its:its,h:62+its.reduce(function(s,i){return s+i.h+8;},0)+8};
  });
  var pendH=st.pend.length?44+Math.ceil(st.pend.length/3)*34+14:0;
  var H=96+16+76+(cards.length?40:0)+cards.reduce(function(s,c){return s+c.h+12;},0)+(pendH?pendH+12:0)+(st.recs.length?0:60)+50;
  H=Math.max(H,420);
  var c=document.createElement('canvas');c.width=W;c.height=H;
  var ctx=c.getContext('2d');
  ctx.fillStyle='#f0f4f0';ctx.fillRect(0,0,W,H);
  var hg=ctx.createLinearGradient(0,0,W,96);hg.addColorStop(0,'#e8670a');hg.addColorStop(1,'#f47920');
  ctx.fillStyle=hg;ctx.fillRect(0,0,W,96);
  ctx.fillStyle='#fff';ctx.font='800 30px sans-serif';ctx.textAlign='left';ctx.fillText('\ud83e\uddf0  \u0e2a\u0e23\u0e38\u0e1b\u0e40\u0e0a\u0e47\u0e04\u0e40\u0e04\u0e23\u0e37\u0e48\u0e2d\u0e07\u0e21\u0e37\u0e2d',PAD,44);
  ctx.font='500 18px sans-serif';ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText(dateText+'  \u00b7  WFM NOPBIGMAN',PAD,76);
  var y=112;
  var chips=[[st.recs.length,'\u0e40\u0e0a\u0e47\u0e04\u0e41\u0e25\u0e49\u0e27','#2E7D32','#f1f8e9'],[st.bad.length,'\u0e04\u0e19\u0e17\u0e35\u0e48\u0e1e\u0e1a\u0e0a\u0e33\u0e23\u0e38\u0e14','#dc2626','#fef2f2'],[st.items,'\u0e23\u0e32\u0e22\u0e01\u0e32\u0e23\u0e0a\u0e33\u0e23\u0e38\u0e14','#b91c1c','#fff1f2'],[st.pend.length,'\u0e21\u0e32\u0e41\u0e25\u0e49\u0e27\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e40\u0e0a\u0e47\u0e04','#b45309','#fff7ed']];
  var cw=(W-PAD*2-GAP*3)/4;
  chips.forEach(function(b,i){
    var bx=PAD+i*(cw+GAP);
    ctx.fillStyle=b[3];rr(ctx,bx,y,cw,64,12);ctx.fill();
    ctx.strokeStyle=b[2];ctx.lineWidth=2.5;rr(ctx,bx,y,cw,64,12);ctx.stroke();
    ctx.fillStyle=b[2];ctx.font='800 34px sans-serif';ctx.textAlign='left';ctx.fillText(String(b[0]),bx+16,y+44);
    ctx.font='700 14px sans-serif';ctx.textAlign='right';ctx.fillText(b[1],bx+cw-12,y+38);
  });
  y+=76;
  if(!st.recs.length){ctx.fillStyle='#aaa';ctx.font='500 20px sans-serif';ctx.textAlign='center';ctx.fillText('\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e21\u0e35\u0e43\u0e04\u0e23\u0e40\u0e0a\u0e47\u0e04\u0e40\u0e04\u0e23\u0e37\u0e48\u0e2d\u0e07\u0e21\u0e37\u0e2d\u0e43\u0e19\u0e27\u0e31\u0e19\u0e19\u0e35\u0e49',W/2,y+36);y+=60;}
  if(cards.length){
    ctx.fillStyle='#dc2626';ctx.font='800 22px sans-serif';ctx.textAlign='left';ctx.fillText('\ud83d\udea8  \u0e2d\u0e38\u0e1b\u0e01\u0e23\u0e13\u0e4c\u0e0a\u0e33\u0e23\u0e38\u0e14',PAD,y+26);y+=40;
    cards.forEach(function(cd){
      ctx.fillStyle='#fef2f2';rr(ctx,PAD,y,W-PAD*2,cd.h,14);ctx.fill();
      ctx.strokeStyle='#fca5a5';ctx.lineWidth=2.5;rr(ctx,PAD,y,W-PAD*2,cd.h,14);ctx.stroke();
      ctx.fillStyle='#1a2a1a';ctx.font='800 22px sans-serif';ctx.textAlign='left';ctx.fillText(cd.r.name,PAD+16,y+32);
      ctx.fillStyle='#777';ctx.font='500 15px sans-serif';ctx.fillText(cd.r.zone+'  \u00b7  '+hhmm(cd.r.time)+' \u0e19.',PAD+16,y+54);
      var iy=y+66;
      cd.its.forEach(function(it){
        ctx.fillStyle='#fff';rr(ctx,PAD+12,iy,W-PAD*2-24,it.h,10);ctx.fill();
        ctx.fillStyle='#b91c1c';ctx.font='700 18px sans-serif';
        it.t.forEach(function(l,i){ctx.fillText((i===0?'\u274c  ':'     ')+l,PAD+24,iy+28+i*26);});
        ctx.fillStyle='#1a2a1a';ctx.font='500 16px sans-serif';
        it.n.forEach(function(l,i){ctx.fillText(l,PAD+52,iy+28+it.t.length*26-4+i*23);});
        iy+=it.h+8;
      });
      y+=cd.h+12;
    });
  }
  if(st.pend.length){
    ctx.fillStyle='#fff';rr(ctx,PAD,y,W-PAD*2,pendH,12);ctx.fill();
    ctx.strokeStyle='#fdba74';ctx.lineWidth=2.5;rr(ctx,PAD,y,W-PAD*2,pendH,12);ctx.stroke();
    ctx.fillStyle='#b45309';ctx.font='800 18px sans-serif';ctx.textAlign='left';
    ctx.fillText('\u2753  Check-in \u0e41\u0e25\u0e49\u0e27 \u0e41\u0e15\u0e48\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e40\u0e0a\u0e47\u0e04\u0e40\u0e04\u0e23\u0e37\u0e48\u0e2d\u0e07\u0e21\u0e37\u0e2d ('+st.pend.length+' \u0e04\u0e19)',PAD+16,y+28);
    var colW=(W-PAD*2-24-GAP*2)/3;
    st.pend.forEach(function(n,i){
      var cx=PAD+12+(i%3)*(colW+GAP),cy=y+44+Math.floor(i/3)*34;
      ctx.fillStyle='#fff7ed';rr(ctx,cx,cy,colW,30,8);ctx.fill();
      ctx.fillStyle='#7c2d12';ctx.font='700 14px sans-serif';
      ctx.save();ctx.beginPath();ctx.rect(cx+6,cy,colW-12,30);ctx.clip();ctx.fillText(n,cx+10,cy+20);ctx.restore();
    });
    y+=pendH+12;
  }
  ctx.fillStyle='#aaa';ctx.font='500 14px sans-serif';ctx.textAlign='center';
  ctx.fillText('AIS 3BB \u00b7 WFM System NOPBIGMAN \u00b7 '+dateText,W/2,H-18);
  cb(c);
}
function exDash(){
  if(!dashData)return;
  var st=dashData,ds=document.getElementById('dpk').value;
  var head=['#','ชื่อ-นามสกุล','Zone','วันที่','เวลา','สถานะ','จำนวนชำรุด'].concat(EQUIP.map(function(e){return e.t;}));
  var rows=[head];
  st.recs.forEach(function(r,i){
    var res=r.results||{},bm={};toArr(r.bad).forEach(function(b){bm[b.k]=b.note;});
    rows.push([i+1,r.name||'-',r.zone||'-',r.dateThai||ds,r.time||'-',r.badCount>0?'ชำรุด':'ปกติ',r.badCount||0].concat(EQUIP.map(function(e){var v=res[e.k];return v==='ok'?'ปกติ':v==='bad'?'ชำรุด: '+(bm[e.k]||''):v==='na'?'ไม่มี':'-';})));
  });
  rows.push([]);rows.push(['','','','','','เช็คแล้ว',st.recs.length+' คน']);rows.push(['','','','','','พบชำรุด',st.bad.length+' คน ('+st.items+' รายการ)']);rows.push(['','','','','','มาแล้วยังไม่เช็ค',st.pend.length+' คน']);
  if(st.pend.length){rows.push([]);rows.push(['มาแล้วยังไม่เช็คเครื่องมือ']);st.pend.forEach(function(n,i){rows.push([i+1,n]);});}
  var csv='\uFEFF'+rows.map(function(r){return r.map(function(v){var s=String(v==null?'':v);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;}).join(',');}).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='Equipment_'+ds+'.csv';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);},1000);
  toast('📥 Export สำเร็จ '+st.recs.length+' คน ✓','ok');
}

function toast(msg,type){
  var t=document.getElementById('tst');
  t.textContent=msg;t.className='toast show'+(type?' '+type:'');
  clearTimeout(window._tt);window._tt=setTimeout(function(){t.className='toast';},2800);
}
if(location.hash==='#sum')ldDash();
