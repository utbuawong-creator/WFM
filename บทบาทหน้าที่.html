<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WFM Duty Card Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f172a;
  --panel: rgba(255, 255, 255, 0.95);
  --text: #1e293b;
  --muted: #64748b;
  --brand: #059669;
  --brand-light: #d1fae5;
  --gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
}
body {
  font-family: 'Sarabun', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
}
.card-preview {
  width: 100%;
  max-width: 640px;
  background: var(--panel);
  border-radius: 28px;
  box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.4);
  overflow: hidden;
  position: relative;
  border: 1px solid rgba(255, 255, 255, 0.4);
}
.card-header-bar {
  height: 14px;
  background: var(--gradient);
}
.card-content {
  padding: 40px 36px;
}
h1 {
  font-size: 26px;
  font-weight: 700;
  color: #0f172a;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}
.badge-shift {
  display: inline-flex;
  align-items: center;
  background: var(--brand-light);
  color: var(--brand);
  padding: 8px 18px;
  border-radius: 99px;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 12px;
}
.date-text {
  font-size: 16px;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 32px;
}
.duty-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.duty-item {
  background: #f8fafc;
  border-left: 6px solid var(--brand);
  padding: 20px 24px;
  border-radius: 0 16px 16px 0;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02);
  transition: transform 0.2s;
}
.duty-item:hover {
  transform: translateX(4px);
  background: #f1f5f9;
}
.duty-role {
  font-size: 14px;
  font-weight: 600;
  color: var(--brand);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.duty-name {
  font-size: 20px;
  font-weight: 700;
  color: #0f172a;
  margin-bottom: 4px;
}
.duty-tel {
  font-size: 15px;
  color: var(--muted);
  font-weight: 500;
}
.card-footer {
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid #e2e8f0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  color: var(--muted);
}
</style>
</head>
<body>

<div class="card-preview">
  <div class="card-header-bar"></div>
  <div class="card-content">
    <h1>รายงานการจัดกะและพื้นที่รับผิดชอบ (เหนือล่าง)</h1>
    <div class="badge-shift">รอบปฏิบัติงาน: ( 13:00 - 17:30 น. )</div>
    <div class="date-text">วันที่ 27 ก.ย. 2569</div>
    
    <div class="duty-list">
      <div class="duty-item">
        <div class="duty-role">Escalation & Incident</div>
        <div class="duty-name">จรูญวิชญ์ สิริสวัสดิ์</div>
        <div class="duty-tel">โทร. 062-6051031</div>
      </div>
      
      <div class="duty-item">
        <div class="duty-role">Job over 24h / over SLA</div>
        <div class="duty-name">ชัยทัต ปั่นสุภา</div>
        <div class="duty-tel">โทร. 089-8565518</div>
      </div>
      
      <div class="duty-item">
        <div class="duty-role">OS MA & OPT</div>
        <div class="duty-name">ไพบูลย์ สิทธิ</div>
        <div class="duty-tel">โทร. 089-8565542</div>
      </div>
    </div>

    <div class="card-footer">
      <span>WFM Operations</span>
      <span>By NOPBIGMAN</span>
    </div>
  </div>
</div>

</body>
</html>
