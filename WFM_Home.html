<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WFM NOPBIGMAN">
<title>WFM NOPBIGMAN | หน้าหลัก</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ais-orange: #f47920;
  --ais-green: #8dc63f;
  --3bb-blue: #003087;
  --3bb-green: #00a651;
  --critical: #e8001d;
  --ok: #00a651;
  --bg: #f0f4f0;
  --surface: #fff;
  --border: #e0e8e0;
  --text: #1a2a1a;
  --text2: #5a7a5a;
  --radius: 16px;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); }

/* HEADER */
.header {
  background: linear-gradient(135deg, #e8670a 0%, #f47920 40%, #8dc63f 100%);
  color: #fff; padding: env(safe-area-inset-top,0) 0 0;
  box-shadow: 0 4px 20px rgba(244,121,32,0.35);
}
.header-inner {
  padding: 16px 20px 18px;
  display: flex; align-items: flex-start; justify-content: space-between;
  max-width: 600px; margin: 0 auto;
}
.header-brand .dept { font-size: 10px; letter-spacing: 3px; opacity: 0.8; text-transform: uppercase; font-family: 'Kanit', sans-serif; }
.header-brand .title { font-family: 'Kanit', sans-serif; font-size: 28px; font-weight: 800; line-height: 1.1; text-shadow: 0 2px 6px rgba(0,0,0,0.15); }
.header-brand .sub { font-size: 13px; opacity: 0.8; margin-top: 3px; }
.avatar {
  width: 52px; height: 52px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Kanit', sans-serif; font-size: 18px; font-weight: 800; color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2); flex-shrink: 0;
}

/* CONTENT */
.content { max-width: 600px; margin: 0 auto; padding: 20px 16px 40px; }

/* CLOCK CARD */
.clock-card {
  background: linear-gradient(135deg, #003087, #0057b8);
  border-radius: var(--radius); padding: 14px 18px;
  color: #fff; margin-bottom: 16px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 5px 0 #001f5c;
}
.clock-val { font-family: 'Kanit', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 2px; }
.clock-date { font-size: 13px; opacity: 0.8; margin-top: 2px; }
.online-dot { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: 0.85; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #8dc63f; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(1.3)} }

/* SECTION LABEL */
.sec-lbl {
  font-family: 'Kanit', sans-serif; font-size: 12px; font-weight: 700;
  color: var(--text2); letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 10px;
}

/* APP CARDS */
.app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.app-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 20px 14px 16px; text-align: center; cursor: pointer;
  border: 2px solid var(--border);
  box-shadow: 0 6px 0 #c8c8c8;
  transition: transform 0.1s, box-shadow 0.1s;
  text-decoration: none; display: block; color: inherit;
}
.app-card:active { transform: translateY(5px); box-shadow: 0 1px 0 #c8c8c8; }
.app-card.orange { border-color: var(--ais-orange); box-shadow: 0 6px 0 #b85710; background: linear-gradient(160deg,#fff8f3,#fff); }
.app-card.green { border-color: #5aab1e; box-shadow: 0 6px 0 #3d7a12; background: linear-gradient(160deg,#f5fff0,#fff); }
.app-card.blue { border-color: var(--3bb-blue); box-shadow: 0 6px 0 #001f5c; background: linear-gradient(160deg,#f0f5ff,#fff); }
.app-icon {
  width: 56px; height: 56px; border-radius: 16px;
  margin: 0 auto 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
}
.app-icon.o { background: linear-gradient(135deg,#f47920,#e8670a); box-shadow: 0 3px 0 #b85710; }
.app-icon.g { background: linear-gradient(135deg,#6dc52a,#4a9a18); box-shadow: 0 3px 0 #3d7a12; }
.app-icon.b { background: linear-gradient(135deg,#003087,#0057b8); box-shadow: 0 3px 0 #001f5c; }
.app-name { font-family: 'Kanit', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); }
.app-desc { font-size: 11px; color: var(--text2); margin-top: 3px; font-weight: 500; }

/* STAT CARDS */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-card {
  border-radius: 14px; padding: 16px 14px;
  cursor: pointer; transition: transform 0.1s, box-shadow 0.1s;
}
.stat-card:active { transform: translateY(3px); }
.stat-card.s1 { background: linear-gradient(135deg,#e8f8ef,#f0fff8); border: 2px solid #10b981; box-shadow: 0 5px 0 #065f46; }
.stat-card.s2 { background: linear-gradient(135deg,#fff8f3,#fff); border: 2px solid var(--ais-orange); box-shadow: 0 5px 0 #b85710; }
.stat-card.s3 { background: linear-gradient(135deg,#fff0f0,#fff); border: 2px solid var(--critical); box-shadow: 0 5px 0 #9a0012; }
.stat-card.s4 { background: linear-gradient(135deg,#f0f5ff,#fff); border: 2px solid var(--3bb-blue); box-shadow: 0 5px 0 #001f5c; }
.stat-num { font-family: 'Kanit', sans-serif; font-size: 40px; font-weight: 800; line-height: 1; }
.s1 .stat-num { color: #065f46; } .s2 .stat-num { color: #b85710; }
.s3 .stat-num { color: #9a0012; } .s4 .stat-num { color: #001f5c; }
.stat-lbl { font-size: 12px; font-weight: 700; margin-top: 4px; }
.s1 .stat-lbl { color: #2a8a4a; } .s2 .stat-lbl { color: #c86010; }
.s3 .stat-lbl { color: #b02020; } .s4 .stat-lbl { color: #2050b0; }

/* FOOTER */
.footer { text-align: center; font-size: 11px; color: var(--text2); padding-top: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="dept">WFM · NOPBIGMAN</div>
      <div class="title">หน้าหลัก</div>
      <div class="sub" id="hdr-date">กำลังโหลด...</div>
    </div>
    <div class="avatar">นพ</div>
  </div>
</div>

<div class="content">

  <!-- CLOCK -->
  <div class="clock-card">
    <div>
      <div class="clock-val" id="clock">--:--:--</div>
      <div class="clock-date">เวลาปัจจุบัน</div>
    </div>
    <div class="online-dot"><div class="dot"></div> ระบบออนไลน์</div>
  </div>

  <!-- APPS -->
  <div class="sec-lbl">แอปพลิเคชัน</div>
  <div class="app-grid">
    <a class="app-card orange" href="index.html">
      <div class="app-icon o">✅</div>
      <div class="app-name">รายงานตัว</div>
      <div class="app-desc">Check-in · ลางาน</div>
    </a>
    <a class="app-card green" href="WFM_JobTracker.html">
      <div class="app-icon g">🔧</div>
      <div class="app-name">Job Tracker</div>
      <div class="app-desc">ติดตาม Job · SLA</div>
    </a>
  </div>
  <a class="app-card blue" href="WFM_Dashboard.html" style="margin-bottom:20px;display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left;">
    <div class="app-icon b" style="flex-shrink:0;">📊</div>
    <div>
      <div class="app-name">Dashboard รายงาน</div>
      <div class="app-desc">กราฟ · สรุปผลงาน · Export Excel</div>
    </div>
  </a>

  <!-- STATS -->
  <div class="sec-lbl">สรุปวันนี้</div>
  <div class="stat-grid">
    <div class="stat-card s1" onclick="window.location='index.html'">
      <div class="stat-num" id="s-checkin">-</div>
      <div class="stat-lbl">มาทำงาน 👤</div>
    </div>
    <div class="stat-card s2" onclick="window.location='WFM_JobTracker.html'">
      <div class="stat-num" id="s-job">-</div>
      <div class="stat-lbl">Job กำลังทำ 🔧</div>
    </div>
    <div class="stat-card s3" onclick="window.location='WFM_Dashboard.html'">
      <div class="stat-num" id="s-breach">-</div>
      <div class="stat-lbl">เกิน SLA 🚨</div>
    </div>
    <div class="stat-card s4" onclick="window.location='index.html'">
      <div class="stat-num" id="s-leave">-</div>
      <div class="stat-lbl">ลางาน 📅</div>
    </div>
  </div>

  <div class="footer">
    <div class="dot"></div>
    NOPBIGMAN · WFM System · AIS 3BB
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzXUhD0qbQw4DPb4lMj6-FejgYcylzM4vMX5WeQPdBFMO8VLj-gy3PMcur0xXxaQInK9Q/exec';
const DAYS = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

// CLOCK
function updateClock() {
  const n = new Date();
  document.getElementById('clock').textContent =
    `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
  document.getElementById('hdr-date').textContent =
    `วัน${DAYS[n.getDay()]}ที่ ${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()+543}`;
}
setInterval(updateClock, 1000); updateClock();

// CALL API
function callAPI(params, callback) {
  const url = new URL(SCRIPT_URL);
  Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
  const cb = 'cb_' + Date.now();
  url.searchParams.set('callback', cb);
  window[cb] = (data) => { delete window[cb]; document.getElementById(cb+'_s')?.remove(); callback(null, data); };
  const s = document.createElement('script');
  s.id = cb+'_s'; s.src = url.toString();
  s.onerror = () => callback(new Error('error'));
  document.body.appendChild(s);
  setTimeout(() => { if(window[cb]){delete window[cb];s.remove();callback(new Error('timeout'));} }, 10000);
}

// LOAD STATS
function loadStats() {
  // Attendance summary
  callAPI({ action: 'getSummary' }, (err, data) => {
    if (!err && data.success) {
      document.getElementById('s-checkin').textContent = data.checkin || 0;
      document.getElementById('s-leave').textContent = (data.sick||0) + (data.personal||0) + (data.vacation||0);
    } else {
      document.getElementById('s-checkin').textContent = '-';
      document.getElementById('s-leave').textContent = '-';
    }
  });

  // Job summary
  callAPI({ action: 'getJobs' }, (err, data) => {
    if (!err && data.success) {
      const jobs = data.jobs || [];
      const SLA = { Critical: 3, Major: 10, Minor: 24, Other: 24 };
      const active = jobs.filter(j => j.status === 'active').length;
      const breach = jobs.filter(j => {
        const start = j.startTime ? new Date(j.startTime) : null;
        if (!start) return false;
        const elapsed = (Date.now() - start) / 3600000;
        return elapsed > (SLA[j.priority] || 24);
      }).length;
      document.getElementById('s-job').textContent = active;
      document.getElementById('s-breach').textContent = breach;
    } else {
      document.getElementById('s-job').textContent = '-';
      document.getElementById('s-breach').textContent = '-';
    }
  });
}

loadStats();
setInterval(loadStats, 60000);
</script>
</body>
</html>
